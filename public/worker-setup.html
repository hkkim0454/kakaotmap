<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>바로길 짧은 링크 서버 적용</title><link rel="stylesheet" href="./styles.css?v=20261014.8"><main style="max-width:850px;margin:32px auto;padding:24px"><h1>짧은 링크 서버 적용</h1><p>Cloudflare → Workers 및 Pages → barogil-route-api → 코드 편집에서 기존 코드를 아래 코드로 교체하고 배포하세요.</p><p>기존 TMAP_APP_KEY, KAKAO_REST_API_KEY와 ROUTE_DB 연결은 유지합니다. 새 저장 테이블은 자동으로 생성됩니다.</p><button id="copy" class="primary" disabled>전체 코드 복사</button><p id="status" role="status">코드를 불러오는 중…</p><textarea id="code" readonly style="width:100%;height:50vh;font:12px monospace" aria-label="Cloudflare 서버 코드"></textarea><p><a href="./route-worker.txt">코드 파일 열기</a> · <a href="./">바로길로 돌아가기</a></p></main><script type="module">const code=document.getElementById('code'),status=document.getElementById('status'),button=document.getElementById('copy');try{const response=await fetch('./route-worker.txt',{cache:'no-store'});if(!response.ok)throw Error();code.value=await response.text();button.disabled=false;status.textContent='서버 버전 2026-10-14.1';}catch{status.textContent='코드를 불러오지 못했습니다. 새로고침해 주세요.';}button.onclick=async()=>{try{await navigator.clipboard.writeText(code.value);status.textContent='전체 코드를 복사했습니다. Cloudflare 코드 편집기에 붙여넣고 배포하세요.';}catch{code.focus();code.select();status.textContent='선택된 코드를 복사해 주세요.';}};</script></html>
